<!DOCTYPE html>
<html lang="en">
<head>
  <!-- abode-gate-check -->
  <script>(function(){var p=location.pathname.split("/").pop();if(p==="gate.html")return;if(localStorage.getItem("abodeAccess")!=="granted"){sessionStorage.setItem("abodeReturn",location.pathname+location.search+location.hash);location.replace("gate.html");}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Abode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div data-include="nav"></div>

  <section style="padding:3rem 0; min-height:60vh;">
    <div class="container" style="max-width:440px;">
      <div class="card" style="padding:2.5rem 2rem;">
        <div style="text-align:center; margin-bottom:1.5rem;">
          <div class="logo" style="font-size:2.25rem; margin-bottom:0.25rem;">Abode</div>
          <p style="color:var(--muted); margin:0;">Welcome back.</p>
        </div>

        <!-- Tabs -->
        <div style="display:flex; gap:0.25rem; background:var(--brand-light); padding:0.25rem; border-radius:9999px; margin-bottom:1.5rem;">
          <button class="tabBtn btn btn-sm" data-tab="login"  style="flex:1; background:white; color:var(--ink);">Log in</button>
          <button class="tabBtn btn btn-sm" data-tab="signup" style="flex:1; background:transparent; color:var(--muted);">Create account</button>
        </div>

        <!-- Error banner (shared) -->
        <div id="errorBanner" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
             border-radius:8px; padding:0.75rem 1rem; margin-bottom:1.25rem; font-size:0.9rem;"></div>

        <!-- ── Login form ──────────────────────────────────── -->
        <div id="loginPanel">
          <form id="loginForm" novalidate>
            <label class="label" for="loginEmail">Email</label>
            <input id="loginEmail" type="email" class="input" placeholder="you@example.com"
                   autocomplete="email" required style="margin-bottom:1rem;">

            <label class="label" for="loginPassword">Password</label>
            <input id="loginPassword" type="password" class="input" placeholder="••••••••"
                   autocomplete="current-password" required style="margin-bottom:0.5rem;">

            <div style="text-align:right; margin-bottom:1.25rem;">
              <a href="reset.html" style="font-size:0.85rem; color:var(--muted);">Forgot password?</a>
            </div>

            <button id="loginBtn" type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:1rem;">
              Log in
            </button>
          </form>
        </div>

        <!-- ── Signup shortcut (redirects to /signup.html) ── -->
        <div id="signupPanel" style="display:none; text-align:center; padding:1rem 0;">
          <p style="color:var(--muted); margin-bottom:1.25rem; font-size:0.95rem;">
            Create a full account to browse, list, and make offers.
          </p>
          <a href="signup.html" class="btn btn-primary" style="display:block; padding:0.85rem; font-size:1rem; text-align:center;">
            Create account
          </a>
        </div>

      </div>
    </div>
  </section>

  <div data-include="footer"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // If already signed-in, skip the login page
    AbodeAuth.onAuthChanged(async (user) => {
      if (!user) return;
      await user.reload();
      if (!user.emailVerified) {
        window.location.href = "verify-email.html";
        return;
      }
      const userDoc = await AbodeAuth.getUserDoc(user.uid);
      const isSeller = userDoc?.roles?.seller;
      const isBuyer  = userDoc?.roles?.buyer;
      if (isSeller && isBuyer) {
        window.location.href = "dashboard.html"; // dashboard handles role selector
      } else if (isSeller) {
        window.location.href = "seller-dashboard.html";
      } else {
        window.location.href = "buyer-dashboard.html";
      }
    });

    // Tab switching
    document.querySelectorAll(".tabBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.getElementById("loginPanel").style.display  = tab === "login"  ? "block" : "none";
        document.getElementById("signupPanel").style.display = tab === "signup" ? "block" : "none";
        document.querySelectorAll(".tabBtn").forEach(b => {
          b.style.background = b === btn ? "white" : "transparent";
          b.style.color      = b === btn ? "var(--ink)" : "var(--muted)";
        });
        document.getElementById("errorBanner").style.display = "none";
      });
    });

    // Login form submit
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn    = document.getElementById("loginBtn");
      const banner = document.getElementById("errorBanner");
      const email  = document.getElementById("loginEmail").value.trim();
      const pass   = document.getElementById("loginPassword").value;

      btn.disabled    = true;
      btn.textContent = "Logging in…";
      banner.style.display = "none";

      try {
        const user = await AbodeAuth.signIn(email, pass);

        if (!user.emailVerified) {
          window.location.href = "verify-email.html";
          return;
        }

        const userDoc  = await AbodeAuth.getUserDoc(user.uid);
        const isSeller = userDoc?.roles?.seller;
        const isBuyer  = userDoc?.roles?.buyer;

        if (isSeller && isBuyer) {
          window.location.href = "dashboard.html";
        } else if (isSeller) {
          window.location.href = "seller-dashboard.html";
        } else {
          window.location.href = "buyer-dashboard.html";
        }
      } catch (err) {
        let msg = "Incorrect email or password. Please try again.";
        if (err.code === "auth/user-not-found")    msg = "No account found with that email.";
        if (err.code === "auth/invalid-email")     msg = "Please enter a valid email address.";
        if (err.code === "auth/too-many-requests") msg = "Too many attempts. Please wait a moment and try again.";
        banner.textContent   = msg;
        banner.style.display = "block";
        btn.disabled    = false;
        btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
