<!DOCTYPE html>
<html lang="en">
<head>
  <!-- abode-gate-check -->
  <script>(function(){var p=location.pathname.split("/").pop();if(p==="gate.html")return;if(localStorage.getItem("abodeAccess")!=="granted"){sessionStorage.setItem("abodeReturn",location.pathname+location.search+location.hash);location.replace("gate.html");}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Abode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div data-include="nav"></div>

  <section style="padding:4rem 0; min-height:70vh; display:flex; align-items:center;">
    <div class="container" style="max-width:440px;">
      <div class="card" style="padding:2.5rem 2rem;">

        <!-- Default state: enter email -->
        <div id="requestView">
          <div style="text-align:center; margin-bottom:1.75rem;">
            <div class="logo" style="font-size:2.25rem; margin-bottom:0.25rem;">Abode</div>
            <p style="color:var(--muted); margin:0;">Reset your password</p>
          </div>

          <p style="color:var(--muted); font-size:0.95rem; margin-bottom:1.5rem; line-height:1.6;">
            Enter the email address on your account. We'll send you a link to set a new password.
          </p>

          <div id="errorBanner" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
               border-radius:8px; padding:0.75rem 1rem; margin-bottom:1.25rem; font-size:0.9rem;"></div>

          <form id="resetForm" novalidate>
            <label class="label" for="email">Email address</label>
            <input id="email" type="email" class="input" placeholder="you@example.com"
                   autocomplete="email" required style="margin-bottom:1.25rem;">

            <button id="submitBtn" type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:1rem;">
              Send reset link
            </button>
          </form>

          <div style="text-align:center; margin-top:1.25rem; font-size:0.9rem;">
            <a href="login.html" style="color:var(--muted);">← Back to log in</a>
          </div>
        </div>

        <!-- Success state: email sent -->
        <div id="successView" style="display:none; text-align:center;">
          <div style="font-size:3rem; margin-bottom:1rem;">📬</div>
          <h2 style="font-size:1.5rem; margin-bottom:0.75rem;">Check your inbox</h2>
          <p style="color:var(--muted); line-height:1.6; margin-bottom:2rem;">
            We sent a password reset link to <strong id="sentTo"></strong>.
            Click the link to set a new password, then
            <a href="login.html" style="color:var(--ink);">log in</a>.
          </p>
          <p style="font-size:0.85rem; color:var(--muted);">
            Didn't get it? Check your spam folder or
            <button id="tryAgainBtn" style="background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; font-size:0.85rem; padding:0;">
              try a different email
            </button>.
          </p>
        </div>

      </div>
    </div>
  </section>

  <div data-include="footer"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn    = document.getElementById("submitBtn");
      const banner = document.getElementById("errorBanner");
      const email  = document.getElementById("email").value.trim();

      btn.disabled    = true;
      btn.textContent = "Sending…";
      banner.style.display = "none";

      try {
        await AbodeAuth.sendPasswordReset(email);
        document.getElementById("sentTo").textContent = email;
        document.getElementById("requestView").style.display = "none";
        document.getElementById("successView").style.display  = "block";
      } catch (err) {
        let msg = "Something went wrong. Please try again.";
        if (err.code === "auth/user-not-found") {
          // Don't reveal whether an email exists — show same success message
          document.getElementById("sentTo").textContent = email;
          document.getElementById("requestView").style.display = "none";
          document.getElementById("successView").style.display  = "block";
          return;
        }
        if (err.code === "auth/invalid-email") msg = "Please enter a valid email address.";
        banner.textContent   = msg;
        banner.style.display = "block";
        btn.disabled    = false;
        btn.textContent = "Send reset link";
      }
    });

    document.getElementById("tryAgainBtn").addEventListener("click", () => {
      document.getElementById("successView").style.display  = "none";
      document.getElementById("requestView").style.display  = "block";
      const btn = document.getElementById("submitBtn");
      btn.disabled    = false;
      btn.textContent = "Send reset link";
    });
  </script>
</body>
</html>
