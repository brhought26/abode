<!DOCTYPE html>
<html lang="en">
<head>
  <!-- abode-gate-check -->
  <script>(function(){var p=location.pathname.split("/").pop();if(p==="gate.html")return;if(localStorage.getItem("abodeAccess")!=="granted"){sessionStorage.setItem("abodeReturn",location.pathname+location.search+location.hash);location.replace("gate.html");}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Abode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div data-include="nav"></div>

  <section style="padding:3rem 0; min-height:70vh;">
    <div class="container" style="max-width:480px;">
      <div class="card" style="padding:2.5rem 2rem;">

        <div style="text-align:center; margin-bottom:1.75rem;">
          <div class="logo" style="font-size:2.25rem; margin-bottom:0.25rem;">Abode</div>
          <p style="color:var(--muted); margin:0;">Create your free account.</p>
        </div>

        <!-- Error banner -->
        <div id="errorBanner" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
             border-radius:8px; padding:0.75rem 1rem; margin-bottom:1.25rem; font-size:0.9rem;"></div>

        <form id="signupForm" novalidate>

          <!-- Role picker -->
          <div style="margin-bottom:1.25rem;">
            <label class="label">I want to</label>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-top:0.35rem;">
              <label id="roleBuyerLabel" class="card" style="padding:0.85rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem; border:2px solid var(--ink);">
                <input type="radio" name="role" value="buyer" checked style="accent-color:var(--ink);">
                <span style="font-size:0.9rem; font-weight:500;">Buy a home</span>
              </label>
              <label id="roleSellerLabel" class="card" style="padding:0.85rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem; border:2px solid var(--line);">
                <input type="radio" name="role" value="seller" style="accent-color:var(--ink);">
                <span style="font-size:0.9rem; font-weight:500;">Sell my home</span>
              </label>
            </div>
          </div>

          <!-- Name row -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:1rem;">
            <div>
              <label class="label" for="firstName">First name</label>
              <input id="firstName" type="text" class="input" placeholder="Jane" autocomplete="given-name" required>
            </div>
            <div>
              <label class="label" for="lastName">Last name</label>
              <input id="lastName" type="text" class="input" placeholder="Buyer" autocomplete="family-name" required>
            </div>
          </div>

          <label class="label" for="email">Email</label>
          <input id="email" type="email" class="input" placeholder="you@example.com"
                 autocomplete="email" required style="margin-bottom:1rem;">

          <label class="label" for="password">Password</label>
          <input id="password" type="password" class="input" placeholder="At least 8 characters"
                 autocomplete="new-password" minlength="8" required style="margin-bottom:1rem;">

          <label class="label" for="phone">Phone number <span style="color:var(--muted); font-weight:400;">(optional)</span></label>
          <input id="phone" type="tel" class="input" placeholder="(555) 000-0000"
                 autocomplete="tel" style="margin-bottom:1.5rem;">

          <button id="submitBtn" type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:1rem;">
            Create account
          </button>

          <p style="font-size:0.8rem; color:var(--muted); text-align:center; margin-top:1rem;">
            By creating an account you agree to Abode's
            <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
          </p>

          <div style="text-align:center; margin-top:1.25rem; font-size:0.9rem; color:var(--muted);">
            Already have an account?
            <a href="login.html" style="color:var(--ink); font-weight:500;">Log in</a>
          </div>
        </form>

      </div>
    </div>
  </section>

  <div data-include="footer"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Role card highlight
    document.querySelectorAll("input[name='role']").forEach(radio => {
      radio.addEventListener("change", () => {
        document.getElementById("roleBuyerLabel").style.borderColor  =
          document.querySelector("input[value='buyer']").checked ? "var(--ink)" : "var(--line)";
        document.getElementById("roleSellerLabel").style.borderColor =
          document.querySelector("input[value='seller']").checked ? "var(--ink)" : "var(--line)";
      });
    });

    // Form submit
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn    = document.getElementById("submitBtn");
      const banner = document.getElementById("errorBanner");

      const firstName = document.getElementById("firstName").value.trim();
      const lastName  = document.getElementById("lastName").value.trim();
      const email     = document.getElementById("email").value.trim();
      const password  = document.getElementById("password").value;
      const phone     = document.getElementById("phone").value.trim() || null;

      if (!firstName || !lastName) {
        banner.textContent = "Please enter your first and last name.";
        banner.style.display = "block";
        return;
      }

      btn.disabled    = true;
      btn.textContent = "Creating account…";
      banner.style.display = "none";

      try {
        await AbodeAuth.signUp(firstName, lastName, email, password, phone);
        window.location.href = "verify-email.html";
      } catch (err) {
        let msg = "Something went wrong. Please try again.";
        if (err.code === "auth/email-already-in-use")   msg = "An account with that email already exists.";
        if (err.code === "auth/invalid-email")           msg = "Please enter a valid email address.";
        if (err.code === "auth/weak-password")           msg = "Password must be at least 8 characters.";
        banner.textContent   = msg;
        banner.style.display = "block";
        btn.disabled    = false;
        btn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
